name: Publish API documentation (release)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (existing release tag, e.g. 1.0.0); the documentation is generated from the selected branch'
        required: true
        type: string

permissions:
  checks: write

jobs:
  publish-doc-release:
    uses: eclipse-keypop/keypop-actions/.github/workflows/reusable-publish-doxygen.yml@main # NOSONAR - Same organization, trusted source
    with:
      version: ${{ github.event.inputs.version || github.ref_name }}
    secrets: inherit # NOSONAR - Same organization, trusted source
